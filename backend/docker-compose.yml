services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: adgen
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs-perms:
    image: alpine
    user: root
    volumes:
      - rustfsdata:/data
    command: chown -R 10001:10001 /data

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  celery-worker:
    build:
      context: .
    command: >
      python -m celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q default,strategy,compositor,audio,finalize
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  celery-worker-gpu:
    build:
      context: .
    command: >
      python -m celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=1
      --pool=solo
      -Q image_gen,video_gen
      -n gpu1@%h
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  celery-worker-gpu-2:
    profiles: ["image2"]
    build:
      context: .
    command: >
      python -m celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=1
      --pool=solo
      -Q image_gen
      -n gpu2@%h
    env_file: ../.env
    environment:
      - APP_LOCAL_IMAGE_URL=http://flux-server-2:8002
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  celery-beat:
    build:
      context: .
    command: >
      python -m celery -A app.workers.celery_app beat
      --loglevel=info
    env_file: ../.env
    depends_on:
      valkey:
        condition: service_healthy

  metrics-scraper:
    build:
      context: .
    command: python -m app.services.metrics_scraper
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      amd-device-metrics-exporter:
        condition: service_started

volumes:
  pgdata:
  rustfsdata:
