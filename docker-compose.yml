# Created by Metrum AI for AMD

include:
  - ./backend/docker-compose.yml
  - ./UI/docker-compose.yml
  - ./metrics/docker-compose.yml
  - ./services/ollama/docker-compose.yml
  - ./services/openclaw/docker-compose.yml
  - ./services/kokoro-tts/docker-compose.yml
  - ./services/flux-server/docker-compose.yml
  - ./services/ltx-video/docker-compose.yml

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - prometheus
      - minio
      - ollama
      - openclaw
      - kokoro-tts
