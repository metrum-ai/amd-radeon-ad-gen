map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Default is 1m; reference images as base64 in JSON exceed that and return 413.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    location = /backend { return 301 /backend/; }
    location /backend/ {
        set $backend_upstream backend:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /metrics { return 301 /metrics/; }
    location /metrics/ {
        set $metrics_upstream prometheus:9090;
        rewrite ^/metrics/(.*)$ /$1 break;
        proxy_pass http://$metrics_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /ollama { return 301 /ollama/; }
    location /ollama/ {
        proxy_buffering off;
        set $ollama_upstream ollama:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass http://$ollama_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /openclaw { return 301 /openclaw/; }
    location /openclaw/ {
        proxy_buffering off;
        set $openclaw_upstream openclaw:18789;
        rewrite ^/openclaw/(.*)$ /$1 break;
        proxy_pass http://$openclaw_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /flux-server { return 301 /flux-server/; }
    location /flux-server/ {
        set $flux_upstream flux-server:8002;
        rewrite ^/flux-server/(.*)$ /$1 break;
        proxy_pass http://$flux_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /flux-server-2 { return 301 /flux-server-2/; }
    location /flux-server-2/ {
        set $flux2_upstream flux-server-2:8002;
        rewrite ^/flux-server-2/(.*)$ /$1 break;
        proxy_pass http://$flux2_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /ltx-video { return 301 /ltx-video/; }
    location /ltx-video/ {
        set $video_upstream ltx-video:8004;
        rewrite ^/ltx-video/(.*)$ /$1 break;
        proxy_pass http://$video_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /kokoro-tts { return 301 /kokoro-tts/; }
    location /kokoro-tts/ {
        set $tts_upstream kokoro-tts:8880;
        rewrite ^/kokoro-tts/(.*)$ /$1 break;
        proxy_pass http://$tts_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /storage { return 301 /storage/; }
    location /storage/ {
        set $rustfs_upstream rustfs:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$rustfs_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location = /storage-console { return 301 /storage-console/; }
    location /storage-console/ {
        set $rustfs_console_upstream rustfs:9001;
        rewrite ^/storage-console/(.*)$ /$1 break;
        proxy_pass http://$rustfs_console_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }

    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream; # nosemgrep: dynamic-proxy-host, missing-internal
    }
}
