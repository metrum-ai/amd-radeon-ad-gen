services:
  flux-server:
    profiles: ["image"]
    build:
      context: .
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - HSA_OVERRIDE_GFX_VERSION=12.0.1
      - HIP_VISIBLE_DEVICES=${FLUX_GPU_ID:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - FLUX_MODEL_ID=black-forest-labs/FLUX.1-schnell
      - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ${HOST_HOME:-.}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8002/health'); import json; d=json.loads(r.read()); exit(0 if d.get('loaded') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 1800s

  flux-server-2:
    profiles: ["image2"]
    build:
      context: .
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - HSA_OVERRIDE_GFX_VERSION=12.0.1
      - HIP_VISIBLE_DEVICES=${FLUX_GPU_2_ID:-2}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - FLUX_MODEL_ID=black-forest-labs/FLUX.1-schnell
      - PYTORCH_HIP_ALLOC_CONF=expandable_segments:True
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ${HOST_HOME:-.}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8002/health'); import json; d=json.loads(r.read()); exit(0 if d.get('loaded') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 1800s
