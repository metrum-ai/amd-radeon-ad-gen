services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    user: "0:0"
    # If the previous container was stopped without releasing its gateway
    # lease, a fresh start fails with "Another Gateway owner lease is still
    # active" until that lease expires (5 min after its last heartbeat). With
    # on-failure, Docker keeps retrying with backoff, so it recovers on its own.
    restart: on-failure
    volumes:
      - ./config/openclaw.json:/tmp/openclaw-seed.json:ro
      - openclaw-home:/home/node/.openclaw
    environment:
      OPENCLAW_AUTH_TOKEN: ${OPENCLAW_AUTH_TOKEN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown node:node /home/node/.openclaw
        sed 's|\${OPENCLAW_AUTH_TOKEN}|'"$${OPENCLAW_AUTH_TOKEN}"'|' /tmp/openclaw-seed.json > /home/node/.openclaw/openclaw.json
        chown node:node /home/node/.openclaw/openclaw.json
        exec su -s /bin/sh node -c "node openclaw.mjs gateway --allow-unconfigured"
    # service_started (not service_healthy): Ollama only turns healthy after its
    # model download, which can take hours on a slow link, and nginx waits on
    # openclaw, so waiting for healthy could keep the whole UI down.
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/v1/models -H \"Authorization: Bearer $${OPENCLAW_AUTH_TOKEN}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  openclaw-home:
